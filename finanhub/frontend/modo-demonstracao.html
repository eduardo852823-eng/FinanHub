<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Modo de demonstração — FinanHub</title>
<link rel="stylesheet" href="css/global.css">
<style>
  .demo-screen {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: var(--space-6);
  }
  .demo-icon {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--blue-soft);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: var(--space-6);
  }
</style>
</head>
<body>
  <div class="topbar screen" style="padding-bottom:0;">
    <a href="perfil.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
  <div class="demo-screen">
    <div class="demo-icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="6" rx="8" ry="3" stroke="#3b82f6" stroke-width="1.8"/><path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6" stroke="#3b82f6" stroke-width="1.8"/><path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6" stroke="#3b82f6" stroke-width="1.8"/></svg>
    </div>
    <h1 style="font-size:20px; font-weight:700; margin-bottom: var(--space-3);">Usar dados de demonstração</h1>
    <p class="text-secondary" style="max-width:280px; margin-bottom: var(--space-8);">
      Criaremos algumas contas e transações fictícias para você testar o aplicativo.
    </p>
    <div style="width:100%; max-width:280px;">
      <button class="btn btn-primary" onclick="ativarDemo()">Ativar</button>
    </div>
    <p class="text-muted text-sm" style="margin-top: var(--space-6); max-width:280px;">
      Os dados são fictícios e não representam movimentações reais.
    </p>
  </div>

  <script src="js/app.js"></script>
  <script>
    function ativarDemo() {
      sessionStorage.removeItem('finanhub_demo_state_v1');
      FinanHub.getState();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
