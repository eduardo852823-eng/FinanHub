<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Perfil — FinanHub</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <a href="dashboard.html" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="width:36px;"></div>
    </div>

    <div class="flex items-center gap-3" style="margin-bottom: var(--space-6);">
      <div class="avatar" style="width:52px;height:52px;font-size:18px;" id="perfil-inicial">D</div>
      <div>
        <div class="font-bold" style="font-size:16px;" id="perfil-nome">Dudu Silva</div>
        <div class="text-muted text-sm" id="perfil-email">dudu@email.com</div>
      </div>
    </div>

    <div class="card" style="padding: 0 var(--space-5);">
      <a href="dashboard.html" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v10h14V10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="grow">Início</span>
      </a>
      <a href="bancos.html" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="grow">Minhas instituições</span>
      </a>
      <a href="transacoes.html" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 10l5-5 5 5M7 14l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="grow">Transações</span>
      </a>
      <a href="categorias.html" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
        <span class="grow">Categorias</span>
      </a>
      <a href="relatorios.html" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="grow">Relatórios</span>
      </a>
    </div>

    <div class="card mt-4" style="padding: 0 var(--space-5);">
      <a href="#" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.5"/></svg>
        <span class="grow">Configurações</span>
      </a>
      <a href="modo-demonstracao.html" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="grow">Modo de demonstração</span>
      </a>
      <a href="#" class="link-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="grow">Ajuda</span>
      </a>
      <a href="login.html" class="link-row" style="color: var(--red);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="grow">Sair</span>
      </a>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const s = FinanHub.getState();
    document.getElementById('perfil-nome').textContent = s.usuario.nome + (s.usuario.sobrenome ? ' ' + s.usuario.sobrenome : ' Silva');
    document.getElementById('perfil-email').textContent = s.usuario.email;
    document.getElementById('perfil-inicial').textContent = s.usuario.nome[0];
  </script>
</body>
</html>
