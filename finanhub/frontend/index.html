<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FinanHub</title>
<link rel="stylesheet" href="css/global.css">
<style>
  body { padding-bottom: 0; }
  .splash {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: var(--space-6);
  }
  .splash .mark {
    width: 96px; height: 96px; border-radius: 24px;
    background: var(--blue-soft);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: var(--space-6);
  }
  .splash h1 { font-size: 26px; font-weight: 800; margin-bottom: var(--space-3); }
  .splash p { color: var(--text-secondary); font-size: 15px; max-width: 280px; margin-bottom: var(--space-8); }
</style>
</head>
<body>
  <div class="splash">
    <div class="mark">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
        <path d="M4 18V10M10 18V6M16 18V13M22 18V8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>FinanHub</h1>
    <p>Sua vida financeira mais simples. Conecte seus bancos, acompanhe seus gastos e conquiste seus objetivos.</p>
    <div style="width:100%; max-width:280px;">
      <a href="login.html" class="btn btn-primary">
        Começar
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
