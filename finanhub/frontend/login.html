<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Entrar — FinanHub</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-logo">
      <div class="mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M4 18V10M10 18V6M16 18V13M22 18V8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="word">Finan<span class="hub">Hub</span></div>
    </div>
    <p class="auth-tagline">Todas as suas finanças em um só lugar.</p>

    <div id="modo-botoes" class="auth-buttons">
      <div id="google-btn" style="display:flex; justify-content:center;"></div>
      <button class="btn btn-secondary" onclick="irParaEmail()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.8"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Entrar com e-mail
      </button>
    </div>

    <form id="modo-email" class="auth-buttons" style="display:none;" onsubmit="enviarLoginEmail(event)">
      <div class="input-group">
        <label>E-mail</label>
        <input class="input-field" type="email" placeholder="seu@email.com" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input class="input-field" type="password" placeholder="••••••••" required>
      </div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>

    <div class="auth-footer">
      <a href="cadastro.html" class="btn-text">Criar conta</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('modo') === 'email') {
      document.getElementById('modo-botoes').style.display = 'none';
      document.getElementById('modo-email').style.display = 'flex';
    } else {
      renderBotaoGoogle('google-btn');
    }
  </script>
</body>
</html>
